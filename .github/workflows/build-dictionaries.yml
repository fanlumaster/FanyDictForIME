name: Build dictionaries

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built dictionaries as a release
        required: false
        type: boolean
        default: false
      tag:
        description: Release tag to publish under, for example dict-2026.09.05
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dictionaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        # requirements.txt also lists pywin32, which cannot install on Linux, and readmdict,
        # which is only needed by the one-off extract_oaldpe_headwords.py helper. The shipping
        # pipeline needs pypinyin alone. Pinned so a rebuild produces identical databases.
        run: python -m pip install --disable-pip-version-check pypinyin==0.55.0

      - name: Build every dictionary
        run: python build_all.py --clean --fetch-references --require-all

      - name: Verify the built artifacts
        run: python tools/verify_dictionaries.py

      - name: Summarize
        run: |
          {
            echo '### Dictionary artifacts'
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            for artifact in msime.db english.db others.db dict_japanese.dat mozc_dictionary_oss_README.txt; do
              printf '| %s | %s |\n' "$artifact" "$(du -h "out/$artifact" | cut -f1)"
            done
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dictionaries
          path: |
            out/msime.db
            out/english.db
            out/others.db
            out/dict_japanese.dat
            out/mozc_dictionary_oss_README.txt
            out/SHA256SUMS.txt
          retention-days: 7
          compression-level: 9

  publish:
    name: Publish release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate the requested tag
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^dict-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Tag must look like dict-YYYY.MM.DD or dict-YYYY.MM.DD.N, got '$TAG_NAME'." >&2
            exit 1
          fi

      - name: Download the built dictionaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dictionaries
          path: out

      - name: Verify the downloaded checksums
        working-directory: out
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes="Dictionary artifacts built from \`$SOURCE_SHA\` by the Build dictionaries workflow.

          Consumed by the Windows installer release workflow in \`metasequoiaime/MSIME-Windows\`.

          \`\`\`
          $(cat out/SHA256SUMS.txt)
          \`\`\`"
          gh release create "$TAG_NAME" \
            --repo "$GH_REPO" \
            --target "$SOURCE_SHA" \
            --title "Dictionaries $TAG_NAME" \
            --notes "$notes" \
            out/msime.db out/english.db out/others.db out/dict_japanese.dat \
            out/mozc_dictionary_oss_README.txt out/SHA256SUMS.txt
